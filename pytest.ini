[pytest]
# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings

# Coverage options (when pytest-cov is used)
# Run: pytest --cov=. --cov-report=term-missing

# Test paths
testpaths = tests

# Minimum Python version
minversion = 3.8
